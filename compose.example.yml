services:
  mediadl-mcp:
    build: .
    image: mediadl-mcp:latest
    container_name: mediadl-mcp
    # MCP over HTTP (streamable). Set http.listen (default 0.0.0.0:8000) and
    # http.token (bearer / ?api_key= auth) in config.json.
    restart: unless-stopped
    # No host port published: Caddy reaches this over the internal network.
    # (Publish 8000:8000 yourself if you want direct LAN access without TLS.)
    expose:
      - "8000"
    volumes:
      # Your config (contains qBittorrent + indexer credentials).
      - ./config.json:/data/config.json:ro
      # Persistent confirmation tokens (survive restarts/reboots).
      - mediadl-data:/data
    environment:
      RUST_LOG: info

  # TLS-terminating reverse proxy with automatic HTTPS (Let's Encrypt).
  # Set MCP_DOMAIN to your public hostname and make sure ports 80/443 are open
  # and DNS points at this host. Caddy handles cert issuance + renewal.
  caddy:
    image: caddy:2
    container_name: mediadl-caddy
    restart: unless-stopped
    depends_on:
      - mediadl-mcp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-mediadl.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional: a qBittorrent instance to download into. Enable with:
  #   docker compose --profile qbittorrent up
  # Then set "qbittorrent_url": "http://qbittorrent:8080" in config.json.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: ["qbittorrent"]
    restart: unless-stopped
    ports:
      - "8080:8080"   # WebUI
      - "6881:6881"   # BT (tcp)
      - "6881:6881/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads

volumes:
  mediadl-data:
  caddy-data:
  caddy-config:
  qbittorrent-config:
  qbittorrent-downloads:

[package]
name = "mediadl-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = "0.8.35"
reqwest = { version = "0.13.4", features = ["rustls", "cookies", "multipart", "form"] }
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
scraper = { version = "0.27.0", features = ["atomic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }
